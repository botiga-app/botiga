<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1,viewport-fit=cover">
<title>YourStore · Shoppable</title>
<style>
  *,*::before,*::after{box-sizing:border-box}
  html,body{margin:0;padding:0;height:100%;background:#000;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;overflow:hidden;-webkit-font-smoothing:antialiased}
  .frame{max-width:430px;margin:0 auto;height:100vh;background:#000;position:relative;overflow:hidden}
  .topbar{position:absolute;top:0;left:0;right:0;display:flex;justify-content:space-between;padding:14px 16px;z-index:10;background:linear-gradient(180deg,rgba(0,0,0,0.5),transparent)}
  .topbar a,.topbar button{background:rgba(0,0,0,0.5);backdrop-filter:blur(10px);color:#fff;border:none;border-radius:50%;width:36px;height:36px;display:flex;align-items:center;justify-content:center;cursor:pointer;text-decoration:none;font-size:16px}
  .topbar .title{background:rgba(0,0,0,0.5);backdrop-filter:blur(10px);padding:8px 14px;border-radius:99px;font-size:13px;font-weight:600}

  .feed{height:100%;overflow-y:scroll;scroll-snap-type:y mandatory;-webkit-overflow-scrolling:touch}
  .slide{height:100vh;scroll-snap-align:start;position:relative;display:flex;align-items:flex-end}
  .slide.s1{background:linear-gradient(135deg,#1e3a8a,#7c3aed)}
  .slide.s2{background:linear-gradient(135deg,#581c87,#ec4899)}
  .slide.s3{background:linear-gradient(135deg,#7c2d12,#f97316)}
  .vid-tag{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);font-size:80px;opacity:0.7;pointer-events:none}

  .rail{position:absolute;right:14px;bottom:200px;display:flex;flex-direction:column;gap:18px;z-index:5}
  .rail button{background:transparent;border:none;color:#fff;font-size:13px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:4px;padding:0;font-weight:600;text-shadow:0 1px 4px rgba(0,0,0,0.5)}
  .rail button .ic{font-size:28px}

  .views{position:absolute;top:64px;right:14px;background:rgba(0,0,0,0.5);backdrop-filter:blur(10px);padding:5px 10px;border-radius:99px;font-size:12px;display:flex;align-items:center;gap:5px;z-index:5}

  .shelf{position:absolute;left:0;right:0;bottom:0;padding:14px;background:linear-gradient(180deg,transparent,rgba(0,0,0,0.85) 30%);z-index:6}
  .shelf-title{font-size:12px;text-transform:uppercase;letter-spacing:0.08em;color:#aaa;margin:0 4px 8px;display:flex;align-items:center;gap:6px;font-weight:600}
  .shelf-title::before{content:"";flex:1;height:1px;background:#444}
  .shelf-title::after{content:"";flex:1;height:1px;background:#444}
  .pcards{display:flex;gap:10px;overflow-x:auto;padding:0 4px 4px;scrollbar-width:none}
  .pcards::-webkit-scrollbar{display:none}
  .pcard{flex-shrink:0;width:140px;background:rgba(20,20,20,0.95);backdrop-filter:blur(10px);border-radius:10px;overflow:hidden;border:1px solid rgba(255,255,255,0.08)}
  .pcard .pimg{width:100%;height:90px;background:linear-gradient(135deg,#fbcfe8,#e879f9);display:flex;align-items:center;justify-content:center;font-size:28px}
  .pcard.p2 .pimg{background:linear-gradient(135deg,#fde68a,#f59e0b);color:#78350f}
  .pcard.p3 .pimg{background:linear-gradient(135deg,#bfdbfe,#3b82f6)}
  .pcard .pbody{padding:9px 10px}
  .pcard .pnm{font-size:12px;font-weight:600;margin:0 0 3px;line-height:1.25;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .pcard .ppr{font-size:13px;font-weight:700;color:#fff;margin:0 0 8px}
  .pcard .ppr .was{color:#888;text-decoration:line-through;font-weight:500;font-size:11px;margin-left:4px}
  .pcard .pbtns{display:flex;gap:5px}
  .pcard .pbtns button{flex:1;border:none;border-radius:6px;padding:6px 0;font-size:11px;font-weight:600;cursor:pointer;color:#fff}
  .pbtn-cart{background:#222}
  .pbtn-buy{background:#fff;color:#000}
  .pbtn-neg{background:linear-gradient(135deg,#ec4899,#db2777);width:100%;margin-top:5px;padding:7px 0;border:none;border-radius:6px;color:#fff;font-size:11px;font-weight:600;cursor:pointer}

  .launcher{position:fixed;bottom:24px;right:14px;width:56px;height:56px;border-radius:50%;background:linear-gradient(135deg,#a855f7,#ec4899);display:flex;align-items:center;justify-content:center;font-size:24px;box-shadow:0 8px 24px rgba(0,0,0,0.4);cursor:pointer;z-index:20;border:2px solid rgba(255,255,255,0.15)}
  .launcher::after{content:"";position:absolute;top:6px;right:6px;width:10px;height:10px;background:#22c55e;border:2px solid #000;border-radius:50%}
</style>
</head>
<body>

<div class="frame">

  <div class="topbar">
    <a href="index.html" title="Back">←</a>
    <div class="title">YourStore</div>
    <button title="Sound">🔊</button>
  </div>

  <div class="feed">

    <div class="slide s1">
      <div class="vid-tag">👰</div>
      <div class="views">👁 4.2k</div>
      <div class="rail">
        <button><span class="ic">🤍</span><span>234</span></button>
        <button><span class="ic">💬</span><span>12</span></button>
        <button><span class="ic">↗️</span><span>Share</span></button>
      </div>
      <div class="shelf">
        <div class="shelf-title">Shop this look</div>
        <div class="pcards">
          <div class="pcard">
            <div class="pimg">👗</div>
            <div class="pbody">
              <p class="pnm">Bridal Lace Gown</p>
              <p class="ppr">$189<span class="was">$249</span></p>
              <div class="pbtns">
                <button class="pbtn-cart">🛒</button>

              </div>
              <a href="customer-negotiate.html"><button class="pbtn-neg">🤝 Make an offer</button></a>
            </div>
          </div>
          <div class="pcard p2">
            <div class="pimg">📿</div>
            <div class="pbody">
              <p class="pnm">Pearl Drop Earrings</p>
              <p class="ppr">$48</p>
              <div class="pbtns">
                <button class="pbtn-cart">🛒</button>
                <button class="pbtn-buy">⚡</button>
              </div>
              <a href="customer-negotiate.html"><button class="pbtn-neg">🤝 Make an offer</button></a>
            </div>
          </div>
          <div class="pcard p3">
            <div class="pimg">👜</div>
            <div class="pbody">
              <p class="pnm">Beaded Reticule Bag</p>
              <p class="ppr">$75<span class="was">$99</span></p>
              <div class="pbtns">
                <button class="pbtn-cart">🛒</button>
                <button class="pbtn-buy">⚡</button>
              </div>
              <a href="customer-negotiate.html"><button class="pbtn-neg">🤝 Make an offer</button></a>
            </div>
          </div>
        </div>
      </div>
    </div>

    <div class="slide s2">
      <div class="vid-tag">💃</div>
      <div class="views">👁 1.8k</div>
      <div class="rail">
        <button><span class="ic">❤️</span><span>1.2k</span></button>
        <button><span class="ic">💬</span><span>34</span></button>
        <button><span class="ic">↗️</span><span>Share</span></button>
      </div>
      <div class="shelf">
        <div class="shelf-title">Shop this look</div>
        <div class="pcards">
          <div class="pcard">
            <div class="pimg" style="background:linear-gradient(135deg,#fef3c7,#facc15)">👗</div>
            <div class="pbody">
              <p class="pnm">Off-Shoulder Regency Gown</p>
              <p class="ppr">$229<span class="was">$299</span></p>
              <div class="pbtns">
                <button class="pbtn-cart">🛒</button>
                <button class="pbtn-buy">⚡</button>
              </div>
              <a href="customer-negotiate.html"><button class="pbtn-neg">🤝 Make an offer</button></a>
            </div>
          </div>
        </div>
      </div>
    </div>

    <div class="slide s3">
      <div class="vid-tag">🎀</div>
      <div class="views">👁 940</div>
      <div class="rail">
        <button><span class="ic">🤍</span><span>78</span></button>
        <button><span class="ic">💬</span><span>3</span></button>
        <button><span class="ic">↗️</span><span>Share</span></button>
      </div>
      <div class="shelf">
        <div class="shelf-title">Shop this look</div>
        <div class="pcards">
          <div class="pcard p2">
            <div class="pimg">🎀</div>
            <div class="pbody">
              <p class="pnm">Wide Lace Corset Belt</p>
              <p class="ppr">$38<span class="was">$68</span></p>
              <div class="pbtns">
                <button class="pbtn-cart">🛒</button>
                <button class="pbtn-buy">⚡</button>
              </div>
              <a href="customer-negotiate.html"><button class="pbtn-neg">🤝 Make an offer</button></a>
            </div>
          </div>
        </div>
      </div>
    </div>

  </div>

  <div class="launcher" title="Open concierge">💬</div>
</div>

</body>
</html>
